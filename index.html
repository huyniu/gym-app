<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="theme-color" content="#0a0a0b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Gym Log</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="hdr"></header>
<main id="main"></main>

<div id="rest" hidden>
  <div class="rest-in">
    <div class="rest-ring" id="restRing"></div>
    <div class="rest-mid grow"><div class="rest-k">Nghỉ phục hồi</div><div id="restTime">0:00</div></div>
    <button data-act="restAdj" data-d="-15">−15s</button>
    <button data-act="restAdj" data-d="15">+15s</button>
    <button class="skip" data-act="restSkip">Bỏ qua</button>
  </div>
</div>

<nav id="tabs"></nav>
<div id="sheet" hidden><div class="sheet-bg" data-act="closeSheet"></div><div class="sheet-panel" id="sheetPanel"></div></div>
<div id="toast"></div>
<div id="flash" aria-hidden="true"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="mealFile" accept="image/*" hidden>
<input type="file" id="famFile" accept="image/*" hidden>
<input type="file" id="vaultFile" accept="image/*" hidden>
<input type="file" id="vaultImportFile" hidden>

<script src="data.js"></script>
<script src="js/core.js"></script>
<script src="js/ai.js"></script>
<script src="js/workout.js"></script>
<script src="js/coach.js"></script>
<script src="js/food.js"></script>
<script src="js/body.js"></script>
<script src="js/vault.js"></script>
<script src="js/days.js"></script>
<script src="js/views.js"></script>
<script src="js/main.js"></script>
</body>
</html>
